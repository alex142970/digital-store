services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
      POSTGRES_DB: store
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U store -d store']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://store:store@db:5432/store
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-dev-admin-token}
      PORT: 3000
    ports:
      - '127.0.0.1:3000:3000'
    command: sh -c "node src/db/migrate.ts && node src/db/seed.ts && node src/server.ts"

volumes:
  pgdata:
